<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約系統</title>
  <style>
    :root {
      --primary-color: #333;
      --border-color: #e0e0e0;
      --hover-color: #f5f5f5;
      --disabled-bg: #f9f9f9;
      --disabled-text: #b0b0b0;
      --alert-color: #e67e22;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: var(--primary-color);
    }

    .mode-switch {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    .mode-switch button {
      background: none;
      border: none;
      font-size: 18px;
      color: #888;
      cursor: pointer;
      padding: 5px 0;
    }
    .mode-switch button.active {
      color: var(--primary-color);
      font-weight: bold;
      border-bottom: 2px solid var(--primary-color);
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      margin-top: 30px;
      display: flex;
      align-items: center;
    }
    .section-title::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border-color);
      margin-left: 15px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      flex: 1;
      min-width: 200px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"], input[type="tel"], input[type="date"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
      background-color: #fff;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    
    .time-btn {
      background-color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      user-select: none;
    }
    .time-btn:hover:not(.disabled):not(.selected) {
      border-color: #999;
      background-color: var(--hover-color);
    }
    .time-btn.selected {
      border-color: var(--primary-color);
      border-width: 2px;
      font-weight: bold;
    }
    .time-btn.disabled {
      background-color: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
      border-color: #eee;
    }
    .time-btn .sub-text {
      font-size: 12px;
      margin-top: 4px;
      color: var(--alert-color);
    }

    .time-grid input[type="radio"] {
      display: none;
    }
    
    .closed-message {
      color: var(--alert-color);
      padding: 20px 0;
      font-weight: bold;
      font-size: 16px;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .booking-item {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .booking-item.selected {
      border-color: #d32f2f;
      background-color: #fff8f8;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
    }
    .submit-btn:disabled {
      background-color: #ccc;
    }
    .submit-btn.delete-btn {
      background-color: #d32f2f;
    }
    .secondary-btn {
      padding: 12px 20px;
      background-color: #666;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="mode-switch">
    <button type="button" id="btnModeAdd" class="active" onclick="switchMode('add')">線上預約</button>
    <button type="button" id="btnModeDelete" onclick="switchMode('delete')">取消預約</button>
  </div>

  <!-- 新增預約表單 -->
  <form id="addForm">
    <div class="form-row">
      <div class="form-group">
        <label>預約日期 (開放 30 天內)</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label>服務項目</label>
        <select id="service">
          <option value="整復">整復</option>
          <option value="放鬆後整復">放鬆後整復</option>
        </select>
      </div>
    </div>

    <div class="section-title">預約時段</div>
    <div class="time-grid" id="timeGrid"></div>
    <input type="hidden" id="selectedTime" required>

    <div class="section-title">聯絡資訊</div>
    <div class="form-row">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required>
      </div>
      <div class="form-group">
        <label>聯絡電話</label>
        <input type="tel" id="phone" placeholder="09XX-XXX-XXX" required>
      </div>
    </div>

    <button type="submit" id="addSubmitBtn" class="submit-btn">確認預約</button>
  </form>

  <!-- 取消預約區塊 -->
  <div id="deleteSection" style="display: none;">
    <div class="form-row" style="align-items: flex-end;">
      <div class="form-group">
        <label>輸入預約姓名查詢</label>
        <input type="text" id="searchName" placeholder="請輸入當初預約的姓名">
      </div>
      <button type="button" class="secondary-btn" onclick="searchUserBookings()">搜尋紀錄</button>
    </div>

    <div id="searchResults" style="display: none;">
      <div class="section-title">點選欲取消的預約紀錄</div>
      <div class="booking-list" id="bookingList"></div>

      <div class="section-title">身份驗證</div>
      <div class="form-group">
        <label>驗證聯絡電話</label>
        <input type="tel" id="deletePhone" placeholder="請輸入預約時的電話號碼以核對">
      </div>

      <button type="button" id="deleteSubmitBtn" class="submit-btn delete-btn" onclick="confirmDelete()">確認取消該筆預約</button>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw11dGh1xOzTrIYFsoYqnuX_OhzLWFonUwyl8UP5u7xRUQpVMlbVqxZka5SvApQEvzPxQ/exec';
    
    let bookedSlots = [];
    let selectedBookingTimeForDelete = '';

    // 平日與假日的營業時段定義
    const weekdaySlots = ["17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00", "21:30"];
    const weekendSlots = [
      "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", 
      "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", 
      "16:00", "16:30", "17:00", "17:30", "18:00"
    ];

    // 前端鎖定台灣時間 (UTC+8) 當天至未來 30 天
    function setupDateLimits() {
      const dateInput = document.getElementById('date');

      const getTaiwanDateStr = (dateObj) => {
        const formatter = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
        return formatter.format(dateObj); // 回傳 "YYYY-MM-DD"
      };

      const now = new Date();
      const todayStr = getTaiwanDateStr(now);

      const maxDate = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));
      const maxStr = getTaiwanDateStr(maxDate);

      dateInput.min = todayStr;
      dateInput.max = maxStr;
    }

    function fetchBookedSlots() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          if (data.bookedSlots) {
            bookedSlots = data.bookedSlots;
            renderTimeSlots();
          }
        })
        .catch(err => console.error('無法取得預約資料:', err));
    }

    function renderTimeSlots() {
      const timeGrid = document.getElementById('timeGrid');
      timeGrid.innerHTML = ''; 
      
      const selectedDate = document.getElementById('date').value;
      const selectedTimeInput = document.getElementById('selectedTime');
      selectedTimeInput.value = '';

      if (!selectedDate) {
        timeGrid.innerHTML = '<div style="color:#888; padding: 20px 0;">請先選擇上方「預約日期」</div>';
        return;
      }

      // 判斷選取的日期是星期幾 (0: 週日, 1: 週一, ..., 6: 週六)
      const dateObj = new Date(selectedDate + 'T00:00:00+08:00');
      const dayOfWeek = dateObj.getDay();
      
      // 每週一公休防呆
      if (dayOfWeek === 1) {
        timeGrid.innerHTML = '<div class="closed-message">🚫 本日為公休日，請選擇其他日期喔！</div>';
        return;
      }

      const currentSlots = (dayOfWeek === 0 || dayOfWeek === 6) ? weekendSlots : weekdaySlots;

      currentSlots.forEach(time => {
        const slotKey = `${selectedDate}_${time}`;
        const isBooked = bookedSlots.includes(slotKey);
        
        const label = document.createElement('label');
        label.className = 'time-btn';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'timeSelection';
        radio.value = time;
        
        const mainText = document.createElement('span');
        mainText.textContent = time;
        
        const subText = document.createElement('span');
        subText.className = 'sub-text';

        if (isBooked) {
          label.classList.add('disabled');
          radio.disabled = true;
          subText.textContent = '已被預約';
        }

        radio.addEventListener('change', (e) => {
          document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('selected'));
          if(e.target.checked) {
            label.classList.add('selected');
            selectedTimeInput.value = e.target.value;
          }
        });

        label.appendChild(radio);
        label.appendChild(mainText);
        label.appendChild(subText);
        timeGrid.appendChild(label);
      });
    }

    document.getElementById('date').addEventListener('change', renderTimeSlots);

    function switchMode(mode) {
      document.getElementById('btnModeAdd').className = mode === 'add' ? 'active' : '';
      document.getElementById('btnModeDelete').className = mode === 'delete' ? 'active' : '';
      
      document.getElementById('addForm').style.display = mode === 'add' ? 'block' : 'none';
      document.getElementById('deleteSection').style.display = mode === 'delete' ? 'block' : 'none';
    }

    // 新增預約送出
    document.getElementById('addForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const selectedTime = document.getElementById('selectedTime').value;
      if (!selectedTime) {
        alert('請選擇預約時段！');
        return;
      }

      const submitBtn = document.getElementById('addSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '處理中...';

      const payload = {
        action: 'add',
        date: document.getElementById('date').value,
        time: selectedTime,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        service: document.getElementById('service').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        if (data.result === 'success') {
          location.reload();
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = '確認預約';
        }
      });
    });

    // 依姓名搜尋紀錄
    function searchUserBookings() {
      const searchName = document.getElementById('searchName').value.trim();
      if (!searchName) {
        alert('請輸入姓名進行查詢');
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'search', name: searchName })
      })
      .then(res => res.json())
      .then(data => {
        const listDiv = document.getElementById('bookingList');
        listDiv.innerHTML = '';
        selectedBookingTimeForDelete = '';

        if (data.result === 'success' && data.bookings.length > 0) {
          data.bookings.forEach(item => {
            const div = document.createElement('div');
            div.className = 'booking-item';
            div.innerHTML = `<span>📅 ${item.bookingTime}</span><span>${item.service}</span>`;
            
            div.addEventListener('click', () => {
              document.querySelectorAll('.booking-item').forEach(el => el.classList.remove('selected'));
              div.classList.add('selected');
              selectedBookingTimeForDelete = item.bookingTime;
            });

            listDiv.appendChild(div);
          });
          document.getElementById('searchResults').style.display = 'block';
        } else {
          alert('查無此姓名的預約紀錄，請確認姓名是否填寫正確。');
          document.getElementById('searchResults').style.display = 'none';
        }
      });
    }

    // 確認取消
    function confirmDelete() {
      if (!selectedBookingTimeForDelete) {
        alert('請先點選欲取消的預約紀錄！');
        return;
      }

      const phone = document.getElementById('deletePhone').value.trim();
      if (!phone) {
        alert('請輸入電話號碼以進行驗證');
        return;
      }

      const submitBtn = document.getElementById('deleteSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '取消中...';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'delete',
          bookingTime: selectedBookingTimeForDelete,
          phone: phone
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        if (data.result === 'success') {
          location.reload();
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = '確認取消該筆預約';
        }
      });
    }

    // 初始化日期限制與讀取已被預約時段
    setupDateLimits();
    fetchBookedSlots();
  </script>
</body>
</html>
