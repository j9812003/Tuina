<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約系統 - 店長管理後台</title>
  <style>
    :root {
      --border-color: #333;
      --active-blue: #0056b3;
      --alert-color: #c92a2a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      color: #111;
      font-size: 18px;
      line-height: 1.5;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 3px solid #ccc;
      padding-bottom: 10px;
    }
    .nav-tab {
      flex: 1;
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      padding: 10px 8px;
      border-radius: 6px;
      text-align: center;
    }
    .nav-tab.active {
      color: #000;
      background-color: #f0f0f0;
      border-bottom: 4px solid #000;
    }

    .section-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 18px;
      margin-top: 25px;
      display: flex;
      align-items: center;
      color: #000;
    }
    .section-title::after {
      content: "";
      flex: 1;
      border-bottom: 2px solid #666;
      margin-left: 15px;
    }

    .form-group {
      margin-bottom: 20px;
      width: 100%;
    }

    label {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #000;
    }

    input[type="text"], 
    input[type="password"], 
    input[type="date"], 
    select {
      width: 100%;
      padding: 12px 8px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      background-color: #fff;
      color: #000;
      text-align: center;
    }

    /* 修正手機版日期寬度、文字居中與邊界破版問題 */
    input[type="date"] {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      -webkit-appearance: none;
      min-height: 52px;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: center;
    }

    input:focus, select:focus {
      outline: 3px solid var(--active-blue);
      border-color: var(--active-blue);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: #000;
      color: #fff;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .submit-btn:hover:not(:disabled) {
      background-color: #222;
    }

    .submit-btn:disabled {
      background-color: #aaa;
      border-color: #aaa;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 2px solid var(--border-color);
      padding: 10px;
      text-align: left;
      font-size: 16px;
    }

    th {
      background-color: #f0f0f0;
      font-size: 17px;
    }

    td a {
      color: var(--active-blue);
      font-weight: bold;
      text-decoration: underline;
    }

    .empty-msg {
      text-align: center;
      color: var(--alert-color);
      font-size: 18px;
      font-weight: bold;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('queryTab', this)">📋 當日預約查詢</button>
    <button class="nav-tab" onclick="switchTab('settingTab', this)">⚙️ 特殊營業日設定</button>
  </div>

  <div id="queryTab" class="tab-content active">
    <div class="form-group">
      <label>管理員密碼</label>
      <input type="password" id="queryAdminKey" value="9527" required>
    </div>
    <div class="form-group">
      <label>選擇查詢日期</label>
      <input type="date" id="queryDate" required>
    </div>
    <button type="button" id="searchBtn" class="submit-btn" onclick="fetchDailyBookings()">查詢當日預約</button>

    <div id="bookingResult"></div>
  </div>

  <div id="settingTab" class="tab-content">
    <form id="adminForm">
      <div class="form-group">
        <label>管理員密碼</label>
        <input type="password" id="adminKey" value="9527" required>
      </div>

      <div class="form-group">
        <label>選擇日期</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label>當天設定模式</label>
        <select id="type" required>
          <option value="OFF">🚫 臨時公休 (不開放預約)</option>
          <option value="WEEKEND">🎉 國定假日/彈性放假 (開放 10:00-18:00)</option>
          <option value="WEEKDAY">💼 補班日/加班日 (開放 17:30-21:30)</option>
          <option value="CANCEL">🔄 恢復預設 (刪除此日期的特殊設定)</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">儲存設定</button>
    </form>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw11dGh1xOzTrIYFsoYqnuX_OhzLWFonUwyl8UP5u7xRUQpVMlbVqxZka5SvApQEvzPxQ/exec';

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('queryDate').value = today;
    document.getElementById('date').value = today;

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    function fetchDailyBookings() {
      const adminKey = document.getElementById('queryAdminKey').value.trim();
      const date = document.getElementById('queryDate').value;
      const resultDiv = document.getElementById('bookingResult');
      const btn = document.getElementById('searchBtn');

      if (!adminKey || !date) {
        alert('請填寫密碼與選擇日期');
        return;
      }

      btn.disabled = true;
      btn.textContent = '查詢中...';
      resultDiv.innerHTML = '<div class="empty-msg" style="color:#000;">資料載入中，請稍候...</div>';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'getDailyBookings',
          adminKey: adminKey,
          date: date
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.textContent = '查詢當日預約';

        if (data.result === 'error') {
          alert(data.message);
          resultDiv.innerHTML = '';
          return;
        }

        if (data.bookings && data.bookings.length > 0) {
          // 當日預約依時間由舊到新排序
          data.bookings.sort((a, b) => a.time.localeCompare(b.time));

          let html = `<div class="section-title">📅 ${date} 預約名單 (共 ${data.bookings.length} 組)</div>`;
          html += `<table>
            <thead>
              <tr>
                <th>時間</th>
                <th>姓名</th>
                <th>電話</th>
                <th>服務項目</th>
              </tr>
            </thead>
            <tbody>`;
          
          data.bookings.forEach(item => {
            html += `<tr>
              <td><b>${item.time}</b></td>
              <td>${item.name}</td>
              <td><a href="tel:${item.phone}">${item.phone}</a></td>
              <td>${item.service}</td>
            </tr>`;
          });

          html += `</tbody></table>`;
          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = `<div class="empty-msg">該日期 (${date}) 目前尚無任何預約紀錄。</div>`;
        }
      })
      .catch(err => {
        alert('查詢失敗：' + err);
        btn.disabled = false;
        btn.textContent = '查詢當日預約';
        resultDiv.innerHTML = '';
      });
    }

    document.getElementById('adminForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '處理中...';

      const payload = {
        action: 'setSpecialDay',
        adminKey: document.getElementById('adminKey').value,
        date: document.getElementById('date').value,
        type: document.getElementById('type').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        btn.disabled = false;
        btn.textContent = '儲存設定';
      })
      .catch(err => {
        alert('設定失敗：' + err);
        btn.disabled = false;
        btn.textContent = '儲存設定';
      });
    });
  </script>
</body>
</html>
